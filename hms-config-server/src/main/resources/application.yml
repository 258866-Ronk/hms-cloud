spring:
  application:
    name: hms-config-server
  cloud:
    config:
      server:
        git:
          # 本地 Git 仓库（等价于 Gitee/GitHub 远程仓库，保证离线可运行）
          # 相对路径：脚本会从项目根目录定位 config-repo，可整体拷贝，无需改路径
          # 生产环境替换为 https://gitee.com/xxx/hms-config-repo.git 即可
          uri: file:./config-repo
          default-label: master
          search-paths: ''
          clone-on-start: true
          timeout: 10
          force-pull: true

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
