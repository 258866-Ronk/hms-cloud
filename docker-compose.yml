version: '3.8'

# ==========================================================
# 医院挂号与问诊系统 —— 微服务容器编排文件
# 使用方式：
#   docker-compose up -d --build      # 构建镜像并后台启动全部服务
#   docker-compose ps                 # 查看各容器状态
#   docker-compose logs -f hms-gateway-server
#   docker-compose down               # 停止并移除容器
# ==========================================================

services:

  # ---------------- 基础设施 ----------------
  mysql:
    image: mysql:8.0
    container_name: hms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: '12345678'
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./docs/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4
    networks:
      - hms-net

  hms-eureka-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: hms-eureka-server/target/hms-eureka-server-1.0.0.jar
    container_name: hms-eureka-server
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
    networks:
      - hms-net

  hms-config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: hms-config-server/target/hms-config-server-1.0.0.jar
    container_name: hms-config-server
    ports:
      - "8888:8888"
    environment:
      SERVER_PORT: 8888
    depends_on:
      - hms-eureka-server
    networks:
      - hms-net

  hms-gateway-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: hms-gateway-server/target/hms-gateway-server-1.0.0.jar
    container_name: hms-gateway-server
    ports:
      - "8500:8500"
    environment:
      SERVER_PORT: 8500
    depends_on:
      - hms-eureka-server
      - hms-config-server
    networks:
      - hms-net

  # ---------------- 业务微服务 ----------------
  hms-user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: hms-user-service/target/hms-user-service-1.0.0.jar
    container_name: hms-user-service
    ports:
      - "8071:8071"
    environment:
      SERVER_PORT: 8071
    depends_on:
      - mysql
      - hms-eureka-server
      - hms-config-server
    networks:
      - hms-net

  hms-department-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: hms-department-service/target/hms-department-service-1.0.0.jar
    container_name: hms-department-service
    ports:
      - "8072:8072"
    environment:
      SERVER_PORT: 8072
    depends_on:
      - mysql
      - hms-eureka-server
      - hms-config-server
    networks:
      - hms-net

  hms-schedule-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: hms-schedule-service/target/hms-schedule-service-1.0.0.jar
    container_name: hms-schedule-service
    ports:
      - "8073:8073"
    environment:
      SERVER_PORT: 8073
    depends_on:
      - mysql
      - hms-eureka-server
      - hms-config-server
    networks:
      - hms-net

  hms-register-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: hms-register-service/target/hms-register-service-1.0.0.jar
    container_name: hms-register-service
    ports:
      - "8074:8074"
    environment:
      SERVER_PORT: 8074
    depends_on:
      - mysql
      - hms-eureka-server
      - hms-config-server
    networks:
      - hms-net

  hms-record-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: hms-record-service/target/hms-record-service-1.0.0.jar
    container_name: hms-record-service
    ports:
      - "8075:8075"
    environment:
      SERVER_PORT: 8075
    depends_on:
      - mysql
      - hms-eureka-server
      - hms-config-server
    networks:
      - hms-net

  # ---------------- 监控 ----------------
  hms-hystrix-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: hms-hystrix-dashboard/target/hms-hystrix-dashboard-1.0.0.jar
    container_name: hms-hystrix-dashboard
    ports:
      - "8070:8070"
    environment:
      SERVER_PORT: 8070
    depends_on:
      - hms-eureka-server
    networks:
      - hms-net

networks:
  hms-net:
    driver: bridge
