<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云康医院 · 挂号与问诊平台</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- 顶部导航 -->
<header class="topbar" id="topbar" style="display:none">
    <div class="brand">
        <span class="logo">+</span>
        <div>
            <div class="brand-name">云康医院</div>
            <div class="brand-sub">微服务挂号与问诊平台</div>
        </div>
    </div>
    <nav class="menu" id="menu"></nav>
    <div class="user-box">
        <span id="userInfo"></span>
        <button class="btn btn-ghost" onclick="logout()">退出</button>
    </div>
</header>

<!-- 登录 / 注册 -->
<div class="login-page" id="loginPage">
    <div class="login-card">
        <div class="login-left">
            <h1>云康医院<br>在线挂号与问诊平台</h1>
            <p>Spring Boot + Spring Cloud 微服务架构</p>
            <ul>
                <li>Eureka 服务注册与发现</li>
                <li>Gateway 统一网关 · 鉴权 · 限流</li>
                <li>Config 配置中心 · Feign 服务编排</li>
                <li>Hystrix 熔断降级与监控</li>
            </ul>
        </div>
        <div class="login-right">
            <div class="tabs">
                <span class="tab active" data-tab="login" onclick="switchTab('login')">登录</span>
                <span class="tab" data-tab="reg" onclick="switchTab('reg')">注册</span>
            </div>
            <form id="loginForm" onsubmit="doLogin(event)">
                <label>账号</label>
                <input id="loginUser" placeholder="如 patient1 / D001 / admin" value="patient1">
                <label>密码</label>
                <input id="loginPwd" type="password" placeholder="123456" value="123456">
                <button class="btn btn-primary btn-block" type="submit">登 录</button>
                <div class="demo-tip">
                    演示账号：患者 patient1 / 医生 D001 / 管理员 admin，密码统一 123456
                </div>
            </form>
            <form id="regForm" style="display:none" onsubmit="doRegister(event)">
                <label>账号</label>
                <input id="regUser" placeholder="登录账号">
                <label>密码</label>
                <input id="regPwd" type="password" placeholder="密码">
                <label>姓名</label>
                <input id="regName" placeholder="真实姓名">
                <label>手机号</label>
                <input id="regPhone" placeholder="手机号">
                <button class="btn btn-primary btn-block" type="submit">注 册</button>
            </form>
            <div class="msg" id="loginMsg"></div>
        </div>
    </div>
</div>

<!-- 主内容 -->
<main class="container" id="app" style="display:none"></main>

<!-- 弹窗 -->
<div class="modal-mask" id="modalMask" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head"><span id="modalTitle"></span><button class="btn btn-ghost" onclick="closeModal()">×</button></div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="/js/app.js"></script>
</body>
</html>
